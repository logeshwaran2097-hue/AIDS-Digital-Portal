services:
  - type: web
    name: vsb-aids-portal
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx next build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_VERSION
        value: "20.14.0"
      - key: NODE_OPTIONS
        value: "--max_old_space_size=1024"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: "lonelyboy44y@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: "lonelyboy44y@gmail.com"
      - key: EMAIL_FROM
        value: "V.S.B. AI & DS Portal <lonelyboy44y@gmail.com>"
      - key: NEXT_PUBLIC_APP_NAME
        value: "V.S.B. AI & DS Digital Portal"
      - key: NEXT_PUBLIC_COLLEGE_NAME
        value: "V.S.B. Engineering College"
      - key: NEXT_PUBLIC_DEPARTMENT
        value: "Artificial Intelligence & Data Science"
      - key: NEXT_PUBLIC_LOCATION
        value: "Karur, Tamil Nadu, India"
